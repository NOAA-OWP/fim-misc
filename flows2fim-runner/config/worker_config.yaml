# S3 
s3:
  bucket: fimc-data
  paths:
    # Source data locations
    ripple_collections: ripple/fim_100_domain/collections/
    library_extent: ripple/fim_100_domain/collections/{dir_name}/library_extent/
    flow_files: reference/nwm_return_period_flows/
    
    # Output locations
    output_base: benchmark/ripple_fim_100/{source}/{id}/
    output_with_common: benchmark/ripple_fim_100/{source}/{id}_{common_name}/
    
    # Status tracking
    success_markers: benchmark/ripple_fim_100/status/success/
    error_retry: benchmark/ripple_fim_100/status/errors/retry/
    error_nonretry: benchmark/ripple_fim_100/status/errors/nonretry/
# Naming patterns
naming:
  success_marker: "{dir_name}_{flow_file}.success.json"
  error_marker: "{dir_name}_{flow_file}.error.json"
  output_file: "{return_period}yr_extent_f2f_ver_0_3_0.tif"
  output_with_common: "{return_period}yr_{common_name}_extent_f2f_ver_0_3_0.tif"
  control_file: "{source}_{digit_string}{common_suffix}_{return_period}yr_controls.csv"
# Local directories
work_dirs:
  base: /tmp/f2f_work
  ripple_library: ripple_library
  control_files: control_files
  output: output
# Processing configuration
processing:
  flows2fim_path: flows2fim # This is what the binary is called in the docker image
  output_format: vrt
